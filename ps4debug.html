<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldHEN ps4debug Injector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
        }
        button:hover {
            background-color: #005999;
        }
        .btn-alt {
            background-color: #28a745;
        }
        .btn-alt:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            background-color: #2d2d2d;
            font-family: monospace;
            border-left: 4px solid #007acc;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GoldHEN ps4debug Injector</h2>
    
    <div class="form-group">
        <label for="ipAddress">PS4 IP Address:</label>
        <input type="text" id="ipAddress" placeholder="e.g., 192.168.1.100" value="192.168.1.">
    </div>

    <div class="form-group">
        <label for="repoUrl">GitHub Raw Payload URL:</label>
        <input type="text" id="repoUrl" value="https://githubusercontent.com" placeholder="Direct URL to raw .bin file">
    </div>

    <!-- Option 1: Fetch and send directly to binloader stream -->
    <button onclick="processPayload('inject')">Option 1: Inject Directly (Port 9090)</button>
    
    <!-- Option 2: Fetch and POST to storage path -->
    <button class="btn-alt" onclick="processPayload('upload')">Option 2: Save to /data/payloads (POST via Port 9090)</button>

    <div id="status">Status: Ready to deploy ps4debug.bin</div>
</div>

<script>
    function updateStatus(message, color = "#007acc") {
        const statusBox = document.getElementById('status');
        statusBox.innerText = "Status: " + message;
        statusBox.style.borderLeftColor = color;
    }

    // Master function to handle remote payload retrieval
    async function processPayload(actionType) {
        const ip = document.getElementById('ipAddress').value.trim();
        const githubUrl = document.getElementById('repoUrl').value.trim();

        if (!ip || ip === "192.168.1.") {
            alert("Please input a valid PS4 IP address.");
            return;
        }

        try {
            updateStatus("Downloading ps4debug.bin from GitHub...", "#ffc107");
            
            // Retrieve file array stream directly from GitHub repository
            const response = await fetch(githubUrl);
            if (!response.ok) throw new Error(`Failed to fetch from GitHub (${response.statusText})`);
            
            const payloadBuffer = await response.arrayBuffer();
            updateStatus("Download complete. Preparing delivery...", "#ffc107");

            if (actionType === 'inject') {
                sendDirect(ip, payloadBuffer);
            } else if (actionType === 'upload') {
                sendToDataFolder(ip, payloadBuffer);
            }

        } catch (error) {
            updateStatus("Error fetching payload: " + error.message, "#dc3545");
        }
    }

    // Deliver binary stream to Port 9090 via No-CORS stream injection
    function sendDirect(ip, buffer) {
        updateStatus(`Injecting ps4debug into stream running at ${ip}:9090...`, "#ffc107");

        fetch(`http://${ip}:9090`, {
            method: 'POST',
            mode: 'no-cors',
            body: buffer
        })
        .then(() => {
            updateStatus("Payload packet successfully broadcasted to Port 9090! Check your PS4 display.", "#28a745");
        })
        .catch(err => {
            updateStatus("Direct injection failure: " + err.message, "#dc3545");
        });
    }

    // Deliver file contents via HTTP POST multipart construct to destination storage 
    function sendToDataFolder(ip, buffer) {
        updateStatus(`Uploading binary data structure to http://${ip}:9090/data/payloads...`, "#ffc107");

        // Convert the buffer array into an actual pseudo file entity
        const blob = new Blob([buffer], { type: "application/octet-stream" });
        const formData = new FormData();
        formData.append("file", blob, "ps4debug.bin");

        fetch(`http://${ip}:9090/data/payloads`, {
            method: 'POST',
            body: formData
        })
        .then(res => {
            if (res.ok) {
                updateStatus("Successfully stored ps4debug.bin directly inside /data/payloads!", "#28a745");
            } else {
                updateStatus(`Server rejected store routine. Code: ${res.status}`, "#dc3545");
            }
        })
        .catch(err => {
            updateStatus("Storage delivery pipeline error: " + err.message, "#dc3545");
        });
    }
</script>

</body>
</html>
