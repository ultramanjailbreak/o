<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldHEN Payload Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #005999;
        }
        .btn-alt {
            background-color: #28a745;
        }
        .btn-alt:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            background-color: #2d2d2d;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GoldHEN Payload Injector</h2>
    
    <div class="form-group">
        <label for="ipAddress">PS4 IP Address:</label>
        <input type="text" id="ipAddress" placeholder="e.g., 192.168.1.100" value="192.168.1.">
    </div>

    <div class="form-group">
        <label for="payloadFile">Select Payload (.bin):</label>
        <input type="file" id="payloadFile" accept=".bin">
    </div>

    <!-- Option 1: Direct Network Injection via Port 9090 -->
    <button onclick="injectPayloadDirect()">Option 1: Inject Directly (Port 9090)</button>
    
    <!-- Option 2: Upload via POST request targeting the payload API on port 9090 -->
    <button class="btn-alt" onclick="uploadToDataFolder()">Option 2: Upload to /data/payloads (POST via Port 9090)</button>

    <div id="status">Status: Idle</div>
</div>

<script>
    function updateStatus(message) {
        document.getElementById('status').innerText = "Status: " + message;
    }

    function getPayloadFile() {
        const fileInput = document.getElementById('payloadFile');
        if (fileInput.files.length === 0) {
            alert('Please select a payload file first.');
            return null;
        }
        return fileInput.files[0];
    }

    // Option 1: Direct Network Injection (Port 9090)
    function injectPayloadDirect() {
        const ip = document.getElementById('ipAddress').value;
        const file = getPayloadFile();
        if (!ip || !file) return;

        updateStatus("Reading file...");
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const buffer = e.target.result;
            updateStatus(`Sending payload to ${ip}:9090...`);
            
            fetch(`http://${ip}:9090`, {
                method: 'POST',
                mode: 'no-cors', 
                body: buffer
            })
            .then(() => {
                updateStatus("Payload sent successfully to port 9090!");
            })
            .catch(err => {
                updateStatus("Error sending payload: " + err.message);
            });
        };
        
        reader.readAsArrayBuffer(file);
    }

    // Option 2: Sends an HTTP POST request to save the file into /data/payloads via port 9090
    function uploadToDataFolder() {
        const ip = document.getElementById('ipAddress').value;
        const file = getPayloadFile();
        if (!ip || !file) return;

        updateStatus("Preparing upload to /data/payloads...");
        
        const formData = new FormData();
        formData.append("file", file, file.name);

        // Targeted custom endpoint URL configured for port 9090
        const uploadUrl = `http://${ip}:9090/data/payloads`;

        fetch(uploadUrl, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                updateStatus(`Successfully uploaded ${file.name} to /data/payloads via port 9090!`);
            } else {
                updateStatus(`Server responded with status: ${response.status}`);
            }
        })
        .catch(err => {
            updateStatus("Upload failed: " + err.message);
        });
    }
</script>

</body>
</html>
